; Default target: Cheap Yellow Display (ESP32-2432S028R, 2.8" 240x320 ILI9341)
; Build the original HB9IIU wiring instead with:  pio run -e generic
[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0   ; Specify the version of the platform (or the latest one that worked)
board = esp32dev
framework = arduino
monitor_speed = 115200
;monitor_filters = -e
board_build.partitions = no_ota.csv

; Enable C++17 so we can use structured bindings (auto [a,b]) and other modern C++ features
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED
    ;-D LOAD_GLCD=1     ; 8x6 basic fixed-width font (fastest, always available)
    -D LOAD_FONT2      ; Small 16-pixel high sans serif font
    -D LOAD_FONT4      ; Medium 26-pixel high sans serif bold font
    ;-D LOAD_FONT6      ; Large 48-pixel high numerals (digits only)
    ;-D LOAD_FONT7      ; Very large 75-pixel high numerals (digits only)
    ;-D LOAD_FONT8      ; Huge 100-pixel high numerals (digits only)
    -D LOAD_GFXFF      ; Enable access to FreeFonts (stored in SPIFFS/PROGMEM)
    -D SPI_TOUCH_FREQUENCY=2500000
extra_scripts = ./extra_script.py

; ---------------------------------------------------------------------------
; CYD - ESP32-2432S028R (all-in-one board, 2.8" ILI9341 on HSPI pins)
; LCD reset is tied to the board's EN line, so TFT_RST = -1.
; If the panel stays white / shows garbage, this board is a v3 revision:
; swap ILI9341_2_DRIVER for ST7789_DRIVER below.
; ---------------------------------------------------------------------------
[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BLP=21      ; backlight, active HIGH
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33     ; keeps the XPT2046 deselected; TFT_eSPI's own touch is unused here
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    ; --- Touch: XPT2046 on its own SPI bus, driven by XPT2046_Touchscreen ---
    -D USE_XPT2046_SPI_TOUCH
    -D TOUCH_XPT_SCLK=25
    -D TOUCH_XPT_MOSI=32
    -D TOUCH_XPT_MISO=39
    -D TOUCH_XPT_CS=33
    -D TOUCH_XPT_IRQ=36
    -D TOUCH_ROTATION=3            ; must match tft.setRotation(3)
    ; Raw XPT2046 corner values. If touches land offset or mirrored, build once
    ; with -D TOUCH_DEBUG, read the raw=x,y pairs at the screen corners over
    ; serial, and put those numbers here (swap MIN/MAX to flip an axis).
    -D TOUCH_RAW_X_MIN=300
    -D TOUCH_RAW_X_MAX=3800
    -D TOUCH_RAW_Y_MIN=300
    -D TOUCH_RAW_Y_MAX=3800

; ---------------------------------------------------------------------------
; Original HB9IIU wiring: bare ESP32 devkit + separate ILI9341 module on VSPI
; ---------------------------------------------------------------------------
[env:generic]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER
    -D TFT_CS=15
    -D TFT_RST=2
    ;-D TFT_DC=0  ; ESP32U (with Antenna)
    -D TFT_DC=5   ; ESP32 'Standard'
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_BLP=4 ; backlight pin , can also be connected directly to 5V
    -D TOUCH_CS=22
    -D TFT_MISO=19
    ;-D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
