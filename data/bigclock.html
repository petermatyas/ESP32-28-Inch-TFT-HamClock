<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Big Clock Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/favicon.ico" rel="icon" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <link href="/hamclock.css" rel="stylesheet">
    <script src="/hamclock.js"></script>
    <style>
        @font-face { font-family: 'Digital7'; src: url('/fonts/digital.ttf') format('truetype'); }

        .time-preview {
            border: 6px solid #444;
            border-radius: 16px;
            padding: 10px 30px;
            display: inline-block;
            font-family: 'Digital7', monospace;
            font-size: 64px;
            color: #78d83c;
        }
        #colorPicker { margin: 0 auto; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
                 z-index: 1080; display: none; }
    </style>
</head>
<body>
<div class="container py-4">

    <h1 class="text-center mb-1">Big Clock</h1>
    <p class="text-center text-secondary">
        Face and colour for page 7, the full-screen clock. Tapping the badge
        under it on the device still switches between QTH and UTC time.
    </p>

    <div class="row">
        <div class="col-lg-10 offset-lg-1">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title text-start">Live preview</h5>
                    <div class="time-preview" id="bigClockTime">00:00</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-10 offset-lg-1">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Face</h5>
                    <label class="form-label" for="bigClockStyleSelect">Style</label>
                    <select class="form-select" id="bigClockStyleSelect" style="max-width: 340px;">
                        <option value="0">Seven segment digits</option>
                        <option value="1">Analogue dial with hands</option>
                        <option value="2">Binary (BCD) clock</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-10 offset-lg-1">
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title text-start">Colour</h5>
                    <div id="colorPicker"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="alert alert-info"></div>

<script>
function toast(msg, kind) {
    var t = document.getElementById('toast');
    t.className = 'alert alert-' + (kind || 'info');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.display = 'none'; }, 2500);
}

function hexFrom565(rgb565) {
    var r = Math.round(((rgb565 >> 11) & 0x1F) * 255 / 31);
    var g = Math.round(((rgb565 >> 5) & 0x3F) * 255 / 63);
    var b = Math.round((rgb565 & 0x1F) * 255 / 31);
    return '#' + [r, g, b].map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}

function rgb565FromHex(hex) {
    var r = parseInt(hex.substr(1, 2), 16);
    var g = parseInt(hex.substr(3, 2), 16);
    var b = parseInt(hex.substr(5, 2), 16);
    return (Math.round(r * 31 / 255) & 0x1F) << 11 | (Math.round(g * 63 / 255) & 0x3F) << 5 | (Math.round(b * 31 / 255) & 0x1F);
}

var colorPicker = new iro.ColorPicker('#colorPicker', { width: 200, color: '#78d83c' });

colorPicker.on('color:change', function (color) {
    document.getElementById('bigClockTime').style.color = color.hexString;
});

colorPicker.on('input:end', function (color) {
    fetch('/setcolor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target: 'bigClockTime', color: rgb565FromHex(color.hexString) })
    }).then(function (r) {
        if (!r.ok) throw new Error();
        toast('Colour saved', 'success');
    }).catch(function () { toast('Could not save that colour', 'danger'); });
});

function tick() {
    var now = new Date();
    document.getElementById('bigClockTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
setInterval(tick, 1000);
tick();

document.getElementById('bigClockStyleSelect').addEventListener('change', function () {
    var style = parseInt(this.value, 10);
    fetch('/setbigclockstyle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bigClockStyle: style })
    }).then(function (r) {
        if (!r.ok) throw new Error();
        toast('Face style saved', 'success');
    }).catch(function () { toast('Could not save the face style', 'danger'); });
});

function loadConfig() {
    fetch('/config').then(function (r) { return r.json(); }).then(function (c) {
        document.getElementById('bigClockStyleSelect').value = String(c.bigClockStyle ?? 0);
        document.getElementById('bigClockTime').style.color = hexFrom565(c.bigClockColour ?? 0);
    }).catch(function () { toast('Could not read the current settings', 'danger'); });
}

loadConfig();
</script>
</body>
</html>
